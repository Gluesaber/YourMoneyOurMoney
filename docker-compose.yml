# Local stack. Two ways to use it:
#   docker compose up -d                      -> only PostgreSQL, for `npm run dev`, `npm test` and E2E
#   docker compose --profile app up --build -d -> also builds the production image (root Dockerfile),
#                                                runs migrations + seed once, and serves the app on :3000
# The `app` profile runs the same image that CI builds and Cloud Run deploys (L5-03).
# Every value below is a local-only placeholder; the cloud gets its values from Secret Manager.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ymom
      POSTGRES_PASSWORD: ymom
      POSTGRES_DB: ymom
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates the separate ymom_test database the first time the volume is initialised.
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ymom -d ymom"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs once: applies the Prisma migrations and the idempotent seed, then exits with code 0.
  migrate:
    profiles: ["app"]
    # Reuses the image the `app` service builds (one build, no parallel export of the same tag).
    image: ymom:local
    pull_policy: never
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Local http only. NODE_ENV=production would require ADMIN_PASSWORD and skip demo users (seedData.ts).
      NODE_ENV: development
      DATABASE_URL: postgresql://ymom:ymom@db:5432/ymom?schema=public
    command: ["sh", "-c", "npx prisma migrate deploy && npm run prisma:seed"]
    restart: "no"

  # The client and the API in one container, as on Cloud Run.
  app:
    profiles: ["app"]
    build: .
    image: ymom:local
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # development, not production: the browser reaches this over plain http://localhost, and in
      # production the session cookie is Secure-only (HTTPS), so sign-in would not stick here.
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://ymom:ymom@db:5432/ymom?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-local-compose-only-session-secret}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  db-data:
